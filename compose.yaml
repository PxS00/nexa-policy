services:
  agent:
    build:
      context: .
    container_name: alura-corporate-agent
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434}
    ports:
      - "8501:8501"
    volumes:
      - chroma-data:/app/.chroma
    restart: unless-stopped

volumes:
  chroma-data:
